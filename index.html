<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>AR4</title>
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <video id="camera" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>

  <div id="startOverlay">
    <div id="startBtnWrap">
      <div id="startBtnGlowWidest" aria-hidden="true">liquify</div>
      <div id="startBtnGlowWide" aria-hidden="true">liquify</div>
      <div id="startBtn">liquify</div>
    </div>
  </div>

  <button id="gearBtn" class="iconBtn" aria-label="controls">
    <span class="iconGlowWide" aria-hidden="true">⚙︎</span>
    <span class="iconGlow" aria-hidden="true">⚙︎</span>
    <span class="iconGlyph">⚙︎</span>
  </button>
  <button id="flipBtn" class="iconBtn" aria-label="flip camera">
    <span class="iconGlowWide" aria-hidden="true">⟲</span>
    <span class="iconGlow" aria-hidden="true">⟲</span>
    <span class="iconGlyph">⟲</span>
  </button>

  <div id="panel">
    <div class="row"><label>distortion</label><input type="range" id="p_distortion" min="0" max="2" step="0.01"></div>
    <div class="row"><label>swell speed</label><input type="range" id="p_waveSpeed" min="0" max="2" step="0.01"></div>
    <div class="row"><label>ripple scale</label><input type="range" id="p_rippleScale" min="0.5" max="6" step="0.05"></div>
    <div class="row"><label>contrast</label><input type="range" id="p_contrast" min="0.5" max="2.5" step="0.01"></div>
    <div class="row"><label>brightness</label><input type="range" id="p_brightness" min="-0.5" max="0.5" step="0.005"></div>
    <div class="row"><label>vignette</label><input type="range" id="p_vignette" min="0" max="2" step="0.01"></div>
    <div class="row"><label>grain</label><input type="range" id="p_grain" min="0" max="0.3" step="0.002"></div>
    <div class="row"><label>depth murk</label><input type="range" id="p_murk" min="0" max="1" step="0.01"></div>
    <div class="row"><label>b&amp;w saturation</label><input type="range" id="p_saturation" min="0" max="1" step="0.01"></div>
    <div class="row"><label>line separation</label><input type="range" id="p_double" min="0" max="30" step="0.5"></div>
    <div class="row"><label>line opacity</label><input type="range" id="p_ghostOpacity" min="0" max="0.5" step="0.01"></div>
    <div class="row"><label>line direction</label><input type="range" id="p_angle" min="0" max="180" step="1"></div>
    <div class="row"><label>line drift amount</label><input type="range" id="p_drift" min="0" max="1" step="0.01"></div>
    <div class="row"><label>line drift speed</label><input type="range" id="p_ghostSpeed" min="0" max="1.5" step="0.01"></div>
    <div class="row"><label>line wave amount</label><input type="range" id="p_ghostWaveAmount" min="0" max="6" step="0.1"></div>
    <div class="row"><label>line wave scale</label><input type="range" id="p_ghostWaveScale" min="0.3" max="3" step="0.1"></div>
    <div class="row"><label>line wave speed</label><input type="range" id="p_ghostWaveSpeed" min="0" max="10" step="0.01"></div>
    <div class="row"><label>glow</label><input type="range" id="p_glow" min="0" max="5" step="0.05"></div>
    <div class="row"><label>focus blur</label><input type="range" id="p_focusBlur" min="0" max="8" step="0.1"></div>
    <div class="row"><label>overlay opacity</label><input type="range" id="p_overlayOpacity" min="0" max="1" step="0.01"></div>
    <div class="row"><label>overlay offset x</label><input type="range" id="p_overlayOffsetX" min="-2" max="0.5" step="0.005"></div>
    <div class="row"><label>overlay offset y (portrait)</label><input type="range" id="p_overlayOffsetYPortrait" min="-0.5" max="4" step="0.01"></div>
    <div class="row"><label>overlay offset y (landscape)</label><input type="range" id="p_overlayOffsetYLandscape" min="-0.5" max="4" step="0.01"></div>
    <div class="row"><label>overlay scale</label><input type="range" id="p_overlayScale" min="0.1" max="2" step="0.01"></div>
    <div class="row"><label>shading strength</label><input type="range" id="p_shadingStrength" min="0" max="1" step="0.01"></div>
    <div class="row"><label>background shadow strength</label><input type="range" id="p_overlayShadowStrength" min="0" max="1" step="0.01"></div>
    <button id="resetBtn">reset defaults</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
