<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Liquify</title>
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <video id="camera" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>

  <div id="startOverlay">
    <div id="startBtnWrap">
      <div id="startBtnGlowWidest" aria-hidden="true">liquify</div>
      <div id="startBtnGlowWide" aria-hidden="true">liquify</div>
      <div id="startBtn">liquify</div>
    </div>
  </div>

  <button id="flipBtn" class="iconBtn" aria-label="flip camera">
    <span class="iconGlowWide" aria-hidden="true">⟲</span>
    <span class="iconGlow" aria-hidden="true">⟲</span>
    <span class="iconGlyph">⟲</span>
  </button>

  <!-- temporary Pi-debugging readout — remove once performance is sorted -->
  <div id="debugInfo" style="position:fixed;left:8px;bottom:8px;z-index:60;color:#0f0;font:600 17px/1.35 monospace;background:rgba(0,0,0,0.85);padding:8px 10px;pointer-events:none;white-space:pre;"></div>

  <script src="main.js"></script>
</body>
</html>
