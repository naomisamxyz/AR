<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Liquify</title>
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <video id="camera" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>

  <div id="startOverlay">
    <div id="startBtnWrap">
      <div id="startBtnGlowWidest" aria-hidden="true">liquify</div>
      <div id="startBtnGlowWide" aria-hidden="true">liquify</div>
      <div id="startBtn">liquify</div>
    </div>
  </div>

  <button id="flipBtn" class="iconBtn" aria-label="flip camera">
    <span class="iconGlowWide" aria-hidden="true">⟲</span>
    <span class="iconGlow" aria-hidden="true">⟲</span>
    <span class="iconGlyph">⟲</span>
  </button>

  <!-- invisible kiosk escape hatch — no visual trace, just a tappable
       corner to get out of fullscreen without needing any visible UI -->
  <button id="escapeBtn" aria-label="exit fullscreen"></button>

  <script src="main.js"></script>
</body>
</html>
